# Static, against the musl that Rust's musl targets bring with them (link-self-contained), linked by rust-lld: no
# cross compiler and no C toolchain needed for either target.  lld marks the stack not executable by default.
[target.armv7-unknown-linux-musleabihf]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-self-contained=yes"]

[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-self-contained=yes"]
